name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'macos-latest'
        run: cargo fmt --all --check
      # Clippy runs on both: cfg(windows) code paths only compile there.
      - name: Lint
        run: cargo clippy -p crewkit-core -p crewkit-bridge -p crewkit-cli --all-targets -- -D warnings
      - name: Test
        run: cargo test -p crewkit-core

  desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend
        working-directory: desktop
        run: npm ci && npm run build
      # The desktop crate's build script verifies the bundled bridge
      # resource exists, so build it before checking the crate.
      - name: Bridge binary
        run: cargo build --release -p crewkit-bridge
      - name: Desktop crate
        run: cargo check -p crewkit-desktop
