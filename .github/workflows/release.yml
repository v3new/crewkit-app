name: Release

# Tagging vX.Y.Z builds the app, signs the updater artifact with the
# key from repo secrets, and publishes a GitHub release with latest.json.
# The app's updater endpoint points at the latest release's latest.json,
# so publishing the release IS shipping the update.
#
# Required repo secret:
#   TAURI_SIGNING_PRIVATE_KEY — contents of ~/.tauri/crewkit-updater.key

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build and sign
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build
      - name: Compose latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="target/release/bundle"
          TARBALL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/CrewKit.app.tar.gz"
          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/CrewKit_${VERSION}_aarch64.dmg"
          SIGNATURE="$(cat "$BUNDLE"/macos/CrewKit.app.tar.gz.sig)"
          # Top-level "url" doubles as a plain download link for the
          # landing page; the updater reads "platforms".
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$DMG_URL" \
            --arg tarball "$TARBALL_URL" \
            --arg signature "$SIGNATURE" \
            '{
              version: $version,
              pub_date: $pub_date,
              url: $url,
              platforms: {
                "darwin-aarch64": { signature: $signature, url: $tarball }
              }
            }' > latest.json
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/macos/CrewKit.app.tar.gz
            target/release/bundle/macos/CrewKit.app.tar.gz.sig
            target/release/bundle/dmg/CrewKit_*_aarch64.dmg
            latest.json
