name: Release

# Tagging vX.Y.Z builds the app for macOS and Windows, signs the updater
# artifacts with the key from repo secrets, and publishes a GitHub release
# with latest.json. The app's updater endpoint points at the latest
# release's latest.json, so publishing the release IS shipping the update.
#
# Required repo secret:
#   TAURI_SIGNING_PRIVATE_KEY — contents of ~/.tauri/crewkit-updater.key

on:
  push:
    tags: ["v*"]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build and sign
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build
      - name: Collect artifacts
        run: |
          mkdir upload
          cp target/release/bundle/macos/CrewKit.app.tar.gz upload/
          cp target/release/bundle/macos/CrewKit.app.tar.gz.sig upload/
          cp target/release/bundle/dmg/CrewKit_*_aarch64.dmg upload/
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-macos
          if-no-files-found: error
          path: upload/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build and sign
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir upload
          cp target/release/bundle/nsis/CrewKit_*_x64-setup.exe upload/
          cp target/release/bundle/nsis/CrewKit_*_x64-setup.exe.sig upload/
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-windows
          if-no-files-found: error
          path: upload/*

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Compose latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          MAC_SIG="$(cat dist/CrewKit.app.tar.gz.sig)"
          WIN_SIG="$(cat "dist/CrewKit_${VERSION}_x64-setup.exe.sig")"
          # Top-level "url" doubles as a plain download link for the
          # landing page; the updater reads "platforms".
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$BASE/CrewKit_${VERSION}_aarch64.dmg" \
            --arg mac_url "$BASE/CrewKit.app.tar.gz" \
            --arg mac_sig "$MAC_SIG" \
            --arg win_url "$BASE/CrewKit_${VERSION}_x64-setup.exe" \
            --arg win_sig "$WIN_SIG" \
            '{
              version: $version,
              pub_date: $pub_date,
              url: $url,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > latest.json
      - name: Stable-named installer copies
        # The landing's download buttons use the permalinks
        # …/releases/latest/download/CrewKit_aarch64.dmg and
        # …/CrewKit_x64-setup.exe, which only work for assets whose
        # names never change between releases.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "dist/CrewKit_${VERSION}_aarch64.dmg" CrewKit_aarch64.dmg
          cp "dist/CrewKit_${VERSION}_x64-setup.exe" CrewKit_x64-setup.exe
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            CrewKit_aarch64.dmg
            CrewKit_x64-setup.exe
            latest.json
