[package]
name = "crewkit-desktop"
description = "Crewkit desktop app: one-click installation of AI skills, plugins and MCP servers into every AI client on the machine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "crewkit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
crewkit-core = { path = "../../crates/crewkit-core" }
